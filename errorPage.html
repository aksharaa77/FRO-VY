<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fro-vy | Page Not Found</title>
    <link rel="stylesheet" href="./assets/css/errorStyle.css">
    <script defer src="./assets/js/errorScript.js"></script>
</head>
<body>

    <!-- Floating Animated Icons -->
    <div class="floating-icons">
        <span>🍎</span>
        <span>🧴</span>
        <span>🥥</span>
        <span>🌿</span>
        <span>🍋</span>
    </div>

    <div class="error-container">
        <img src="./assets/images/FRO-VY.png" alt="Fro-vy Logo" class="error-logo">

        <h1 class="error-code">404</h1>
        <h2 class="error-title">Oops! Page Not Found</h2>
        <p class="error-message">
            The page you're looking for doesn't exist or has been moved.<br>
            Don’t worry — you're safe with Fro-vy.
        </p>

        <button id="homeBtn" class="error-btn">Go Back Home</button>

        <p class="error-redirect-msg">
            Redirecting to homepage in <span id="countdown">10</span> seconds…
        </p>
    </div>

</body>
</html>
